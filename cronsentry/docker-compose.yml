services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=cronsentry
      - DB_SSLMODE=disable
      # Optional. Unset keeps email in dry-run mode (logged, not sent).
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cronsentry
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # Leave unset so the browser calls same-origin /api, which nginx proxies.
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  pg_data:
