services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=cronsentry
      - DB_SSLMODE=disable
      # Optional. When true, seed test@example.com / opensentry-demo and attach env webhooks to that user.
      - DEMO_SEED=${DEMO_SEED:-}
      # Optional. Unset keeps email in dry-run (logged, status skipped, not sent).
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=cronsentry
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # Leave unset so the browser calls same-origin /api, which nginx proxies.
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - app

volumes:
  pg_data:
