name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: Go test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cronsentry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: cronsentry/go.sum
      - run: go test ./...
      - run: go build -o /tmp/opensentry ./cmd

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cronsentry/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cronsentry/web/package-lock.json
      - run: npm ci
      - run: npm run build
